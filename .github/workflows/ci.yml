name: CI

on:
  push:
    branches: [main]
  # Every base branch, since pull requests may be stacked.
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # A required check, so it always runs and reports; on a pull request that
  # changes nothing the Go build or tests read, it skips its steps instead.
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      # A pull request's checkout is it merged into its base, so HEAD^ is the
      # base. If git diff errors, the tests run.
      - id: changes
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" != pull_request ] || ! git diff --quiet HEAD^ HEAD -- \
            '*.go' go.mod go.sum internal testdata justfile install.sh .github/workflows/ci.yml; then
            echo go=true >> "$GITHUB_OUTPUT"
          fi
      - if: steps.changes.outputs.go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - if: steps.changes.outputs.go
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          just-version: 1.59.0
      - if: steps.changes.outputs.go
        run: just check
      - if: steps.changes.outputs.go
        run: shellcheck install.sh

  zizmor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: false
      - run: uvx zizmor==1.31.1 --format=github .github/
        env:
          GH_TOKEN: ${{ github.token }}
