name: CI

on:
  push:
    branches: [main]
  # Every base branch, since pull requests may be stacked.
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # A required check, so it always runs and reports; on a pull request that
  # changes nothing the Go build or tests read, it skips its steps instead.
  # On a push the filter does not run, so every step does.
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read # paths-filter lists a pull request's files
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: changes
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            go:
              - '**/*.go'
              - go.mod
              - go.sum
              - 'internal/**'
              - 'testdata/**'
              - justfile
              - install.sh
              - .github/workflows/ci.yml
      - if: steps.changes.outputs.go != 'false'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - if: steps.changes.outputs.go != 'false'
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          just-version: 1.59.0
      - if: steps.changes.outputs.go != 'false'
        run: just check
      - if: steps.changes.outputs.go != 'false'
        run: shellcheck install.sh

  zizmor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: false
      - run: uvx zizmor==1.31.1 --format=github .github/
        env:
          GH_TOKEN: ${{ github.token }}
