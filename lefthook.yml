# pre-commit jobs inherit GIT_DIR and GIT_INDEX_FILE too; they start no Git fixtures, so they are not scrubbed (G-089).
pre-commit:
  parallel: true
  jobs:
    - name: gofmt
      glob: "*.go"
      run: gofmt -w {staged_files}
      stage_fixed: true
    - name: vet
      glob: "*.go"
      run: go vet ./...
    - name: mod-tidy
      glob: "{*.go,go.mod,go.sum}"
      run: go mod tidy -diff

pre-push:
  jobs:
    - name: test
      # Git exports GIT_DIR to hooks; keep every repository variable from every child (G-089).
      run: env -u GIT_DIR -u GIT_WORK_TREE -u GIT_INDEX_FILE -u GIT_COMMON_DIR -u GIT_OBJECT_DIRECTORY -u GIT_ALTERNATE_OBJECT_DIRECTORIES -u GIT_NAMESPACE go test -timeout 120s ./...
