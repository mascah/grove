# The document set and the workflows (CONSTITUTION.md rule 10): a plain list.
# A path is relative to the document root; <change> is the change's folder
# name and <capability> a capability's ID. A workflow's skill is the
# description of the skill init writes for it, and args what that skill
# passes to `instructions <workflow>`, <args> being what the user typed after
# the skill's name. It holds no dependencies between steps and no status.
documents:
  - kind: spec
    path: specs/<capability>/spec.md
    template: templates/spec.md
    guide: guides/spec.md
  - kind: proposal
    path: changes/<change>/proposal.md
    template: templates/proposal.md
    guide: guides/proposal.md
  - kind: change-spec
    path: changes/<change>/specs/<capability>/spec.md
    template: templates/change-spec.md
    guide: guides/change-spec.md
  - kind: tasks
    path: changes/<change>/tasks.md
    template: templates/tasks.md
    guide: guides/tasks.md
  - kind: implementation
    path: changes/<change>/implementation.md
    template: templates/implementation.md
    guide: guides/implementation.md
workflows:
  - name: explore
    skill: Explore an idea with the owner before proposing a change, in an interview that writes nothing unless asked.
    guide: guides/explore.md
  - name: propose
    skill: Propose a change from this conversation or from a description, or revise a drafted change given its ID.
    args: '"<args>"'
    guide: guides/propose.md
    writes: [proposal, change-spec, tasks]
  - name: apply
    skill: Apply an approved change given its ID, building its tasks and recording progress in its implementation.md.
    args: <args>
    guide: guides/apply.md
    writes: [implementation]
  - name: archive
    skill: Archive a finished or dropped change given its ID, first folding a finished change's specs into the maintained specs.
    args: <args>
    guide: guides/archive.md
    writes: [spec, implementation]
