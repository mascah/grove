# Grove's built-in change schema, default (CONSTITUTION.md rule 10): a plain
# list of document kinds and, for each skill, its guide and the kinds it
# writes. A path is relative to the document root; <change> is the change's
# folder name and <capability> a capability's ID. The kind with metadata,
# the change's main document, is written with that .grove.yaml beside it,
# from Grove's own template. It holds no dependencies between steps and
# no status.
description: "Software changes: a proposal, the change to each affected capability's requirements, and tasks."
documents:
  - kind: proposal
    path: changes/<change>/proposal.md
    template: documents/proposal/template.md
    guide: documents/proposal/guide.md
    metadata: changes/<change>/.grove.yaml
  - kind: change-spec
    path: changes/<change>/specs/<capability>/spec.md
    template: documents/change-spec/template.md
    guide: documents/change-spec/guide.md
  - kind: tasks
    path: changes/<change>/tasks.md
    template: documents/tasks/template.md
    guide: documents/tasks/guide.md
  - kind: implementation
    path: changes/<change>/implementation.md
    template: documents/implementation/template.md
    guide: documents/implementation/guide.md
  - kind: spec
    path: specs/<capability>/spec.md
    template: documents/spec/template.md
    guide: documents/spec/guide.md
skills:
  explore:
    guide: skills/explore.md
  prototype:
    guide: skills/prototype.md
  propose:
    guide: skills/propose.md
    writes: [proposal, change-spec, tasks]
  plan:
    guide: skills/plan.md
  implement:
    guide: skills/implement.md
    writes: [proposal, change-spec, tasks, implementation]
  archive:
    guide: skills/archive.md
    writes: [spec, implementation]
