# Grove's skills (CONSTITUTION.md rule 10). A skill's description is the
# description of the skill init writes for it, and args what that skill
# passes to `instructions <skill>`, <args> being what the user typed after
# the skill's name. What Grove requires of a skill is requires/<name>.md, and for implement
# also requires/implement-owner.md or requires/implement-unattended.md; how
# it goes is the change schema's.
- name: explore
  description: Explore an idea with the owner before proposing a change, in an interview that writes nothing unless asked.
- name: prototype
  description: Prototype a question with the owner before proposing a change, in a throwaway experiment on a prototype branch that writes no Grove document.
  args: '"<args>"'
- name: propose
  description: Propose a change from this conversation or from a description, or revise a drafted change given its ID.
  args: '"<args>"'
- name: plan
  description: Plan a cycle of approved changes from a description or one change's ID, or revise a cycle given its ID, asking the owner which changes need a person.
  args: '"<args>"'
- name: implement
  description: Implement an approved change, or each change of a cycle, given its ID with the owner in this session, asking them where the change does not settle a task and revising the change on its branch with their agreement, or with --unattended asking no one, and archiving it when every task is done.
  args: <args>
- name: archive
  description: Archive a finished or dropped change given its ID, first folding a finished change's specs into the maintained specs.
  args: <args>
