# Grove's skills (CONSTITUTION.md rule 10). A skill's description is the
# description of the skill init writes for it, and args what that skill
# passes to `instructions <skill>`, <args> being what the user typed after
# the skill's name. What Grove requires of a skill is requires/<name>.md, for
# a cycle requires/implement-cycle.md, and for an unattended propose
# requires/propose-unattended.md too; how it goes is the change schema's.
- name: explore
  description: Explore an idea with the owner before proposing a change, in an interview that writes nothing unless asked.
- name: prototype
  description: Prototype a question with the owner before proposing a change, in a throwaway experiment on a prototype branch that writes no Grove document.
  args: '"<args>"'
- name: propose
  description: Propose a change from this conversation or from a description, revise a drafted change given its ID, or draft one from a request with --unattended.
  args: '"<args>"'
- name: plan
  description: Plan a cycle of approved changes from a description or one change's ID, or revise a cycle given its ID.
  args: '"<args>"'
- name: implement
  description: Implement an approved or drafted change, or each change of a cycle, given its ID, asking no one, recording each choice for the reviewer, revising the change on its branch where needed, and archiving it when every task is done.
  args: <args>
- name: archive
  description: Archive a finished or dropped change given its ID, first folding a finished change's specs into the maintained specs.
  args: <args>
